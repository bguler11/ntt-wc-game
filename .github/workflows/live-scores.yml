name: Live Match Scores Loop

on:
  schedule:
    - cron: '*/10 15-21 * * *' # 18:00 - 00:00 (TSİ) arası her 10 dakikada bir çalışır, maç varsa kapanmadan döngüye girer
  workflow_dispatch: # Manuel tetikleme

concurrency:
  group: live-scores
  cancel-in-progress: true # Zaten dönen bir script varsa eskisini iptal edip yenisini başlatır

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Firebase Service Account JSON
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ntt-wc-game-6c5fcc94ae05.json

      - name: Run Live Scores Script
        run: node scripts/syncLiveScores.js
